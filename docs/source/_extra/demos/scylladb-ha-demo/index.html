<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScyllaDB HA Simulator — Replication, Consistency &amp; Fault Tolerance</title>
<script>
// ScyllaDB DS theme boot snippet (runs before the stylesheet so there's no flash).
// This simulator has no manual theme toggle — it just follows the OS, same as before.
(function () {
  var KEY = "scylladb-ds-theme";
  var root = document.documentElement;
  var sysDark = window.matchMedia("(prefers-color-scheme: dark)");
  function resolve(pref) { return pref === "system" ? (sysDark.matches ? "dark" : "light") : pref; }
  function setTheme(pref) { root.setAttribute("data-theme", resolve(pref)); }
  setTheme(localStorage.getItem(KEY) || "system");
  sysDark.addEventListener("change", function () {
    if ((localStorage.getItem(KEY) || "system") === "system") setTheme("system");
  });
})();
</script>
<link rel="stylesheet" href="scylladb-ds.css" />
<style>
  /* ---------- bridge: simulator-local var names -> ScyllaDB DS tokens ----------
     Keeping these local names means the rest of this stylesheet (and the SVG
     stage below) didn't need to be rewritten call-site by call-site — they just
     inherit whichever DS token is active for the current data-theme. */
  :root {
    --bg: var(--bg-page);
    --surface: var(--bg-surface);
    --surface-2: var(--bg-surface-alt);
    --border: var(--border-color);
    --text: var(--text-color);
    --text-dim: var(--text-muted);
    --text-faint: var(--text-disabled);

    --accent: var(--btn-primary-bg);
    --accent-ink: var(--btn-primary-text);
    --ok: var(--status-success);
    --ok-bg: var(--status-success-bg);
    --danger: var(--status-error);
    --danger-bg: var(--status-error-bg);
    --warn: var(--status-warning);
    --warn-bg: var(--status-warning-bg);
    --replica: var(--color-primary-500);
    --client: var(--color-secondary-500);

    --font-ui: var(--font-family);
    /* --font-mono comes straight from the DS bundle (Roboto Mono). */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap {
    /* Scale the whole app down to 80% so the simulation panel and controls fit on one laptop
       screen without scrolling. `zoom` (unlike transform: scale) reflows at the smaller size
       instead of just shrinking the paint with the original layout box left behind. Scoped to
       .wrap rather than body so the guided tour's position:fixed overlay — appended straight to
       body, a sibling of .wrap — stays in true (unzoomed) viewport coordinates and still lines
       up with getBoundingClientRect() on zoomed targets. */
    zoom: 0.8;
    max-width: 1320px;
    margin: 0 auto;
    padding: 22px 22px 30px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- header ---------- */
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: var(--border-w) solid var(--border);
    padding-bottom: 14px;
  }
  header.top h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
    font-family: var(--font-family);
  }
  header.top h1 span.accent { color: var(--accent); }

  /* ---------- controls ---------- */
  .controls {
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-1);
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 22px 28px;
    align-items: flex-end;
  }
  .ctrl { display: flex; flex-direction: column; gap: 6px; min-width: 128px; }
  .ctrl label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .ctrl label .val {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
  }
  .ctrl select.form-input,
  .ctrl input[type="number"].form-input {
    width: 100%;
  }
  .divider { width: 1px; align-self: stretch; background: var(--border); }

  .toggle-row { display: flex; align-items: center; }

  /* ---------- main layout ---------- */
  .main {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .stage-card {
    flex: 2 1 560px;
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-1);
    padding: 10px;
    min-width: 380px;
    /* Fixed regardless of node/rack/client count, so the page layout never jumps and the stage
       stays above the fold — the SVG's viewBox still reflects the actual content size, but
       it's scaled (via the default preserveAspectRatio) to fit this constant frame instead of
       the frame growing/shrinking to match the content. */
    height: 480px;
  }
  #stage { width: 100%; height: 100%; display: block; }

  /* ---------- log ---------- */
  .log-card {
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-1);
    padding: 10px 0 10px 16px;
  }
  .log-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-right: 16px;
    margin-bottom: 8px;
  }
  .log-head h2 { margin: 0; }
  .log-body {
    height: 220px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    padding-right: 10px;
    display: flex;
    flex-direction: column-reverse;
  }
  .log-line {
    padding: 3px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    gap: 10px;
    color: var(--text-dim);
  }
  .log-line .t { color: var(--text-faint); flex: none; font-variant-numeric: tabular-nums; }
  .log-line .tag {
    flex: none;
    font-weight: 700;
    border-radius: var(--radius-sm);
    padding: 0 5px;
  }
  .log-line.success .tag { background: var(--ok-bg); color: var(--ok); }
  .log-line.fail .tag { background: var(--danger-bg); color: var(--danger); }
  .log-line.info .tag { background: var(--surface-2); color: var(--text-faint); }
  .log-line.warn .tag { background: var(--warn-bg); color: var(--warn); }

  .page-footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    padding-top: 4px;
  }
  .page-footer a {
    color: var(--accent);
    text-decoration: none;
  }
  .page-footer a:hover, .page-footer a:focus-visible { text-decoration: underline; }

  /* ---------- svg elements ---------- */
  .rack-box { fill: var(--surface-2); stroke-width: 2; transition: stroke .2s; }
  .rack-box-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-anchor: middle; letter-spacing: .04em; pointer-events: none; }

  .node-slot { fill: var(--surface); stroke: var(--ok); stroke-width: 2; cursor: pointer; transition: fill .15s, stroke .15s; }
  .node-slot.down { stroke: var(--text-faint); }
  .node-slot.coordinator { stroke: var(--accent); stroke-width: 3; }
  .node-slot.replica { stroke-dasharray: 5 3; }
  .node-logo { pointer-events: none; transition: filter .15s, opacity .15s; }
  .node-logo.down { filter: grayscale(1); opacity: .55; }
  .node-label { fill: var(--text); font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .node-sub { font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .node-sub.up { fill: var(--ok); }
  .node-sub.down { fill: var(--text-faint); }
  .node-kv { fill: var(--replica); font-family: var(--font-mono); font-size: 7.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; font-variant-numeric: tabular-nums; }
  .node-kv.empty { fill: var(--text-faint); font-weight: 400; font-style: italic; }

  .client-box { fill: var(--surface-2); stroke: var(--client); stroke-width: 2; cursor: default; }
  .client-label { fill: var(--client); font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  .msg-line { fill: none; stroke-width: 1.5; opacity: .55; }
  .msg-line.ok { stroke: var(--ok); }
  .msg-line.fail { stroke: var(--danger); stroke-dasharray: 4 3; }
  .packet { stroke: none; }
  .packet.ok { fill: var(--ok); }
  .packet.fail { fill: var(--danger); }
  .packet.dropped { fill: var(--danger); }
  .arrow-ok { fill: var(--ok); opacity: .85; }
  .arrow-fail { fill: var(--danger); opacity: .85; }

  .packet-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--surface);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .packet-label.ok { fill: var(--ok); }
  .packet-label.fail { fill: var(--danger); }

  .hint-text {
    fill: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 10px;
    text-anchor: middle;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-sm); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 720px) {
    .controls { flex-direction: column; align-items: stretch; }
    .divider { display: none; }
  }

  /* ---------- guided tour ---------- */
  .tour-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: transparent;
  }
  .tour-highlight {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    border: 2px solid var(--accent);
    border-radius: 10px;
    /* The huge spread dims the whole viewport outside this box — a classic spotlight cutout
       without needing an SVG mask. */
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .6), 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: left .2s ease, top .2s ease, width .2s ease, height .2s ease;
  }
  .tour-tooltip {
    position: fixed;
    z-index: 10000;
    width: 260px;
    max-width: calc(100vw - 24px);
    background: var(--bg-surface);
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3);
    padding: 14px 16px;
    transition: left .2s ease, top .2s ease;
  }
  .tour-step {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .tour-title { font-size: 14.5px; font-weight: 700; color: var(--text-emphasis); margin: 0 0 6px; }
  .tour-body { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px; }
  .tour-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tour-actions-right { display: flex; gap: 6px; }
</style>
</head>

</div>

<script>
(function () {
  "use strict";

  const svgNS = "http://www.w3.org/2000/svg";
  const KEYS = ["a", "b", "c", "d", "e", "f"];

  // Rack-grouped layout constants: nodes render as compact cards stacked inside a bordered
  // rack enclosure, one enclosure per rack, laid out left-to-right with generous spacing so
  // neighboring racks read as clearly separate groups rather than one contiguous block.
  const NODE_W = 92;
  const NODE_H = 78;
  const LOGO_SIZE = 24;
  const RACK_PAD_X = 12;
  const RACK_PAD_TOP = 24;
  const RACK_PAD_BOTTOM = 10;
  const NODE_V_GAP = 18;    // gap between stacked nodes within a rack
  const RACK_GAP = 64;      // gap between adjacent racks — kept wide so groups don't crowd
  const CLIENT_MARGIN = 60; // gap between the client column and the first rack
  const STAGE_PAD = 18;

  // Each client is a small card with its own round Write/Read icon buttons — request always
  // originates from a specific client, not a random pick, so it's obvious which one issued it.
  const CLIENT_PAD = 6;
  const CLIENT_LABEL_H = 18;
  const CLIENT_BTN_SIZE = 28;
  const CLIENT_BTN_GAP = 8;   // horizontal gap between the two round buttons
  const CLIENT_ROW_GAP = 6;   // vertical gap between the label and the button row
  const CLIENT_W = CLIENT_PAD * 2 + CLIENT_BTN_SIZE * 2 + CLIENT_BTN_GAP;
  const CLIENT_CARD_H = CLIENT_PAD * 2 + CLIENT_LABEL_H + CLIENT_ROW_GAP + CLIENT_BTN_SIZE;
  const CLIENT_STACK_GAP = 18; // vertical gap between stacked client cards
  // The label above the buttons pushes their row below the card's true geometric center — this
  // offset re-centers a client's message lines on the button row itself, not the whole card.
  const CLIENT_ANIM_Y_OFFSET = CLIENT_PAD + CLIENT_LABEL_H + CLIENT_ROW_GAP + CLIENT_BTN_SIZE / 2 - CLIENT_CARD_H / 2;
  // The write (pencil) and read (eye) buttons sit side by side with no slack in the row — its
  // width is exactly 2 buttons + the gap — so each button's center is this far from the card's
  // horizontal center, symmetric left/right.
  const CLIENT_ICON_X_OFFSET = (CLIENT_BTN_SIZE + CLIENT_BTN_GAP) / 2;

  function fmtVal(v) { return v === undefined ? "∅" : v; }

  // Deterministic hash so a given key always routes to the same token, and therefore the same
  // natural replicas — real drivers don't re-hash a key to a new random position every request.
  // FNV-1a, kept as a fallback for any key outside the fixed KEYS set: a plain polynomial hash on
  // single adjacent ASCII chars (a-f) maps them to consecutive small integers, which is about the
  // worst possible input for `% n`.
  function hashKey(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) {
      h ^= key.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  // For the demo's actual key set (KEYS, a fixed small list) use each key's own index rather than
  // its hash: with only 6 keys, even a perfectly uniform hash collides two keys onto the same
  // token more often than not for n <= 7 (birthday paradox) — indexing guarantees every key gets
  // a distinct token whenever n >= KEYS.length, and the most even possible split otherwise.
  function tokenIndexForKey(key, n) {
    const idx = KEYS.indexOf(key);
    return (idx >= 0 ? idx : hashKey(key)) % n;
  }

  // Rack-aware replica placement, same spirit as NetworkTopologyStrategy: walk the ring
  // clockwise from the token and prefer nodes from racks not yet represented, only doubling
  // up on a rack once every rack has at least one replica (or RF exceeds the rack count).
  function computeReplicaIdxs(tokenStart, rf, n) {
    const chosen = [];
    const usedRacks = new Set();
    const fallback = [];
    for (let step = 0; step < n && chosen.length < rf; step++) {
      const idx = (tokenStart + step) % n;
      const rack = state.nodes[idx].rack;
      if (!usedRacks.has(rack)) {
        chosen.push(idx);
        usedRacks.add(rack);
      } else {
        fallback.push(idx);
      }
    }
    let fi = 0;
    while (chosen.length < rf && fi < fallback.length) chosen.push(fallback[fi++]);
    return chosen;
  }

  // ScyllaDB DS chart tokens (--chart-1..--chart-8) — theme-reactive categorical colors,
  // so rack coloring stays on-brand and adapts automatically across light/dark/scylla.
  const RACK_CHART_VARS = ["--chart-1", "--chart-2", "--chart-3", "--chart-4", "--chart-5", "--chart-6", "--chart-7", "--chart-8"];
  function rackColor(rackIdx) { return `var(${RACK_CHART_VARS[rackIdx % RACK_CHART_VARS.length]})`; }

  const state = {
    numNodes: 6,
    numRacks: 3,
    nodesPerRack: 2,
    rf: 3,
    cl: "QUORUM",
    numClients: 2,
    nodes: [],   // {id, idx, x, y, up, rack}
    clients: [], // {id, x, y}
    gen: 0,
    writeCounters: {},
    smartDrivers: false, // token-aware: route straight to a replica as coordinator, no proxy hop
  };

  // ---------- DOM refs ----------
  const $ = (id) => document.getElementById(id);
  const nodesRange = $("nodesRange"), nodesVal = $("nodesVal");
  const racksRange = $("racksRange"), racksVal = $("racksVal");
  const rfRange = $("rfRange"), rfVal = $("rfVal");
  const clSelect = $("clSelect");
  const clientsRange = $("clientsRange"), clientsVal = $("clientsVal");
  const smartDriversToggle = $("smartDriversToggle");
  const keySelect = $("keySelect"), valueInput = $("valueInput");
  const btnClearLog = $("btnClearLog");
  const btnShowTour = $("btnShowTour");
  const stageEl = $("stage");
  const nodesLayer = $("nodesLayer"), clientsLayer = $("clientsLayer"),
        messagesLayer = $("messagesLayer"), rackBoxesLayer = $("rackBoxesLayer");
  const logBody = $("logBody");

  // ---------- consistency levels ----------
  function clOptionsFor() {
    return [
      { v: "ANY", label: "ANY" },
      { v: "ONE", label: "ONE" },
      { v: "QUORUM", label: "QUORUM" },
      { v: "ALL", label: "ALL" },
    ];
  }

  function requiredAcks(cl, rf) {
    switch (cl) {
      case "ANY": return 1;
      case "ONE": return 1;
      case "QUORUM": return Math.floor(rf / 2) + 1;
      case "ALL": return rf;
      default: return 1;
    }
  }

  function refreshClOptions() {
    const opts = clOptionsFor();
    const prev = state.cl;
    clSelect.innerHTML = "";
    opts.forEach((o) => {
      const el = document.createElement("option");
      el.value = o.v; el.textContent = o.label;
      clSelect.appendChild(el);
    });
    const stillValid = opts.some((o) => o.v === prev);
    state.cl = stillValid ? prev : "QUORUM";
    clSelect.value = state.cl;
  }

  // ---------- layout ----------
  function computeLayoutDims() {
    const nodesPerRack = state.numNodes / state.numRacks;
    const colH = RACK_PAD_TOP + nodesPerRack * NODE_H + Math.max(0, nodesPerRack - 1) * NODE_V_GAP + RACK_PAD_BOTTOM;
    const racksTotalW = state.numRacks * NODE_W + (state.numRacks - 1) * RACK_GAP;
    const clientsStackH = state.numClients * CLIENT_CARD_H + Math.max(0, state.numClients - 1) * CLIENT_STACK_GAP;
    const contentH = Math.max(colH, clientsStackH);
    const clientX = STAGE_PAD + CLIENT_W / 2;
    const racksStartX = clientX + CLIENT_W / 2 + CLIENT_MARGIN;
    const racksTopY = STAGE_PAD;
    const width = racksStartX + racksTotalW + STAGE_PAD;
    const height = racksTopY + contentH + STAGE_PAD;
    // No large fixed floor here on purpose — the stage should hug its actual content (fewer
    // nodes/racks/clients means a visibly smaller frame) rather than always padding out to a
    // fixed minimum canvas size.
    return { nodesPerRack, colH, contentH, racksStartX, racksTopY, clientX, width: Math.max(360, width), height: Math.max(240, height) };
  }

  function layout() {
    const dims = computeLayoutDims();
    state.dims = dims;
    stageEl.setAttribute("viewBox", `0 0 ${dims.width} ${dims.height}`);

    const n = state.numNodes;
    const nodesPerRack = n / state.numRacks;
    state.nodes = [];
    for (let i = 0; i < n; i++) {
      const rack = Math.floor(i / nodesPerRack);
      const slotIdx = i % nodesPerRack;
      const colLeft = dims.racksStartX + rack * (NODE_W + RACK_GAP);
      const slotTop = dims.racksTopY + RACK_PAD_TOP + slotIdx * (NODE_H + NODE_V_GAP);
      state.nodes.push({
        id: "N" + i,
        idx: i,
        rack,
        x: colLeft + NODE_W / 2,
        y: slotTop + NODE_H / 2,
        up: true,
        data: {},
      });
    }
    const c = state.numClients;
    state.clients = [];
    const clientsStackH = c * CLIENT_CARD_H + Math.max(0, c - 1) * CLIENT_STACK_GAP;
    const firstCenterY = dims.racksTopY + dims.contentH / 2 - clientsStackH / 2 + CLIENT_CARD_H / 2;
    for (let i = 0; i < c; i++) {
      const y = firstCenterY + i * (CLIENT_CARD_H + CLIENT_STACK_GAP);
      state.clients.push({
        id: "C" + (i + 1),
        x: dims.clientX,
        y,
        animY: y + CLIENT_ANIM_Y_OFFSET,
        writeX: dims.clientX - CLIENT_ICON_X_OFFSET,
        readX: dims.clientX + CLIENT_ICON_X_OFFSET,
      });
    }
    renderStatic();
  }

  // A lightly-tinted enclosure behind each rack's stacked nodes — with a wide RACK_GAP between
  // columns, this is the "grouped, but not too close" visual: proximity plus a shared border,
  // not a full ring.
  function renderRackBoxes() {
    rackBoxesLayer.innerHTML = "";
    const { racksTopY, colH } = state.dims;
    for (let r = 0; r < state.numRacks; r++) {
      const colLeft = state.dims.racksStartX + r * (NODE_W + RACK_GAP);
      const color = rackColor(r);
      const g = document.createElementNS(svgNS, "g");
      g.style.cursor = "pointer";
      g.innerHTML = `
        <title>Zone/Rack ${r} — click to kill/revive every node in it</title>
        <rect class="rack-box" x="${colLeft - RACK_PAD_X}" y="${racksTopY}" width="${NODE_W + RACK_PAD_X * 2}" height="${colH}" rx="10" stroke="${color}"></rect>
        <text class="rack-box-label" x="${colLeft + NODE_W / 2}" y="${racksTopY + 18}" fill="${color}">ZONE/RACK ${r}</text>
      `;
      g.addEventListener("click", () => toggleRack(r));
      rackBoxesLayer.appendChild(g);
    }
  }

  function renderStatic() {
    renderRackBoxes();

    // clients — each is a small card with its own round Write/Read icon buttons, so a request
    // always originates from a specific, visible client rather than a random pick. The icons are
    // inline SVG (a pencil for write, an eye for read) rather than the DS icon font, since the
    // font file itself isn't vendored alongside this single-file demo.
    const ICON_EDIT = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
    const ICON_EYE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    clientsLayer.innerHTML = "";
    state.clients.forEach((c) => {
      const boxLeft = c.x - CLIENT_W / 2;
      const boxTop = c.y - CLIENT_CARD_H / 2;
      const g = document.createElementNS(svgNS, "g");
      g.innerHTML = `
        <rect class="client-box" x="${boxLeft}" y="${boxTop}" width="${CLIENT_W}" height="${CLIENT_CARD_H}" rx="9"></rect>
        <text class="client-label" x="${c.x}" y="${boxTop + CLIENT_PAD + CLIENT_LABEL_H / 2 + 1}">${c.id}</text>
      `;
      const fo = document.createElementNS(svgNS, "foreignObject");
      fo.setAttribute("x", boxLeft + CLIENT_PAD);
      fo.setAttribute("y", boxTop + CLIENT_PAD + CLIENT_LABEL_H + CLIENT_ROW_GAP);
      fo.setAttribute("width", CLIENT_W - CLIENT_PAD * 2);
      fo.setAttribute("height", CLIENT_BTN_SIZE);
      fo.innerHTML = `
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; justify-content:center; align-items:center; gap:${CLIENT_BTN_GAP}px; width:100%; height:100%;">
          <button type="button" class="btn btn--fab btn--secondary" style="width:${CLIENT_BTN_SIZE}px; height:${CLIENT_BTN_SIZE}px; padding:0;" title="Send write from ${c.id}" aria-label="Send write from ${c.id}">${ICON_EDIT}</button>
          <button type="button" class="btn btn--fab btn--primary" style="width:${CLIENT_BTN_SIZE}px; height:${CLIENT_BTN_SIZE}px; padding:0;" title="Send read from ${c.id}" aria-label="Send read from ${c.id}">${ICON_EYE}</button>
        </div>
      `;
      const [writeBtn, readBtn] = fo.querySelectorAll("button");
      writeBtn.addEventListener("click", () => sendRequest("write", c));
      readBtn.addEventListener("click", () => sendRequest("read", c));
      g.appendChild(fo);
      clientsLayer.appendChild(g);
    });

    renderNodes();
  }

  // Compact "key:value" summary for a node's local store, joined onto one line that fits the card.
  function nodeKvSummary(node) {
    const entries = KEYS.filter((k) => node.data[k] !== undefined).map((k) => `${k}:${node.data[k]}`);
    if (entries.length === 0) return { text: "empty", empty: true };
    let text = entries.join(" ");
    if (text.length > 14) {
      let shown = [];
      for (const e of entries) {
        if ((shown.join(" ") + " " + e).trim().length > 11) break;
        shown.push(e);
      }
      text = shown.join(" ") + ` +${entries.length - shown.length}`;
    }
    return { text, empty: false };
  }

  function renderNodeKv(node) {
    const g = nodesLayer.querySelector(`g[data-idx="${node.idx}"]`);
    if (!g) return;
    const { text, empty } = nodeKvSummary(node);
    const kv = g.querySelector(".node-kv");
    kv.textContent = text;
    kv.classList.toggle("empty", empty);
  }

  function renderNodes() {
    nodesLayer.innerHTML = "";
    state.nodes.forEach((node) => {
      const g = document.createElementNS(svgNS, "g");
      g.setAttribute("data-idx", node.idx);
      g.style.cursor = "pointer";
      const slotX = node.x - NODE_W / 2, slotY = node.y - NODE_H / 2;
      const logoX = node.x - LOGO_SIZE / 2, logoY = slotY + 8;
      const labelY = logoY + LOGO_SIZE + 12;
      const subY = labelY + 12;
      const kvY = subY + 13;
      g.innerHTML = `
        <title>${node.id} — Zone/Rack ${node.rack} — ${node.up ? "UP" : "DOWN"}</title>
        <rect class="node-slot${node.up ? "" : " down"}" x="${slotX}" y="${slotY}" width="${NODE_W}" height="${NODE_H}" rx="9"></rect>
        <use href="#scyllaLogo" class="node-logo${node.up ? "" : " down"}" x="${logoX}" y="${logoY}" width="${LOGO_SIZE}" height="${LOGO_SIZE}"></use>
        <text class="node-label" x="${node.x}" y="${labelY}">${node.id}</text>
        <text class="node-sub ${node.up ? "up" : "down"}" x="${node.x}" y="${subY}">${node.up ? "UP" : "DOWN"}</text>
        <text class="node-kv" x="${node.x}" y="${kvY}"></text>
      `;
      g.addEventListener("click", () => {
        node.up = !node.up;
        log(node.up ? "info" : "warn", `${node.id} manually set ${node.up ? "UP" : "DOWN"} by operator click`);
        renderNodes();
      });
      nodesLayer.appendChild(g);
      renderNodeKv(node);
    });
  }

  // ---------- log ----------
  function log(kind, text) {
    const line = document.createElement("div");
    line.className = "log-line " + kind;
    const now = new Date();
    const t = now.toTimeString().slice(0, 8) + "." + String(now.getMilliseconds()).padStart(3, "0");
    const tagText = { success: "OK", fail: "FAIL", info: "INFO", warn: "WARN" }[kind] || "INFO";
    line.innerHTML = `<span class="t">${t}</span><span class="tag">${tagText}</span><span>${text}</span>`;
    logBody.appendChild(line);
    while (logBody.children.length > 300) logBody.removeChild(logBody.firstChild);
  }

  // ---------- animation ----------
  // Every hop is slowed down 3x from "real time" so the message flow — and in particular the
  // coordinator racing to CL instead of waiting for every replica — is easy to follow with the eye.
  const SLOWDOWN = 3;

  // Random per-node ack latency: real replicas don't all answer in the same time, so each hop
  // gets its own jittered latency on top of a small distance-based component.
  function randomLatency(coordinator, node) {
    const jitter = 120 + Math.random() * 480; // 120-600ms "real" latency, varies per node/request
    return (jitter + dist(coordinator, node) * 0.35) * SLOWDOWN;
  }

  function animatePacket(rawX1, rawY1, rawX2, rawY2, opts) {
    const { duration, fail, label, type, insetStart = 30, insetEnd = 30 } = opts;
    // Pull each end in from its node/client center so the arrowhead lands just outside the
    // destination shape instead of being buried under it. A client endpoint passes insetStart/
    // insetEnd of 0 so the line actually starts/ends at the icon's true middle — the default
    // 30px pull-in is sized for the much larger node/rack cards and would overshoot a 28px
    // client icon (the two icons are only 36px apart center to center).
    const ddx = rawX2 - rawX1, ddy = rawY2 - rawY1;
    const len = Math.hypot(ddx, ddy) || 1;
    const ux = ddx / len, uy = ddy / len;
    const x1 = rawX1 + ux * insetStart, y1 = rawY1 + uy * insetStart;
    const x2 = rawX2 - ux * insetEnd, y2 = rawY2 - uy * insetEnd;

    // Bow the path out into a quadratic curve, perpendicular to the direct line, instead of a
    // straight segment — so a coordinator's several concurrent hops (full read + digest reads,
    // or repeated auto-traffic between the same pair) fan out visually instead of overlapping.
    // Reads get a visibly flatter curve than writes (both still randomized in direction and
    // magnitude), so a glance at the stage tells the two apart even mid-flight.
    const segLen = Math.hypot(x2 - x1, y2 - y1) || 1;
    const px = -(y2 - y1) / segLen, py = (x2 - x1) / segLen;
    const bowFactor = type === "read" ? 0.11 : 0.16;
    const bowRange = type === "read" ? [10, 34] : [16, 50];
    const bow = Math.min(bowRange[1], Math.max(bowRange[0], segLen * bowFactor)) * (Math.random() < 0.5 ? 1 : -1);
    const cx = (x1 + x2) / 2 + px * bow, cy = (y1 + y2) / 2 + py * bow;

    return new Promise((resolve) => {
      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("class", "msg-line " + (fail ? "fail" : "ok"));
      path.setAttribute("d", `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
      path.setAttribute("marker-end", fail ? "url(#arrowFail)" : "url(#arrowOk)");
      messagesLayer.appendChild(path);
      const totalLength = path.getTotalLength();

      const dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("r", 5);
      dot.setAttribute("class", "packet " + (fail ? "fail" : "ok"));
      messagesLayer.appendChild(dot);

      let labelEl = null;
      if (label) {
        labelEl = document.createElementNS(svgNS, "text");
        labelEl.setAttribute("class", "packet-label " + (fail ? "fail" : "ok"));
        labelEl.textContent = label;
        messagesLayer.appendChild(labelEl);
      }

      const cutoff = fail ? 0.6 : 1;
      const start = performance.now();
      function frame(now) {
        const t = Math.min((now - start) / duration, 1);
        const frac = Math.min(t, cutoff);
        const pt = path.getPointAtLength(totalLength * frac);
        dot.setAttribute("cx", pt.x);
        dot.setAttribute("cy", pt.y);
        if (labelEl) {
          labelEl.setAttribute("x", pt.x);
          labelEl.setAttribute("y", pt.y - 11);
        }
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          if (fail) dot.setAttribute("class", "packet dropped");
          setTimeout(() => {
            path.remove(); dot.remove(); if (labelEl) labelEl.remove(); resolve();
          }, (fail ? 260 : 120) * SLOWDOWN);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function highlightCoordinatorAndReplicas(coordinator, replicaIdxs) {
    document.querySelectorAll(".node-slot").forEach((el) => el.classList.remove("coordinator", "replica"));
    nodesLayer.querySelectorAll("g").forEach((g) => {
      const idx = Number(g.getAttribute("data-idx"));
      const slot = g.querySelector(".node-slot");
      if (idx === coordinator.idx) slot.classList.add("coordinator");
      if (replicaIdxs.includes(idx) && idx !== coordinator.idx) slot.classList.add("replica");
    });
  }

  function clearHighlight() {
    document.querySelectorAll(".node-slot").forEach((el) => el.classList.remove("coordinator", "replica"));
  }

  // ---------- core simulation ----------
  // Mirrors the Cassandra/Scylla coordinator contract: the coordinator fails fast with
  // UNAVAILABLE if its failure detector already knows too few natural replicas are live to
  // meet CL (no network attempt made); otherwise it fans out only to the replicas it already
  // believes are live — a known-down replica is never sent a request, since the coordinator
  // has no reason to expect an answer — and replies to the client the instant CL acks arrive,
  // without waiting for the rest. The client gets back an ACK carrying the value on success,
  // or a NACK on any failure path.
  async function sendRequest(type, client) {
    const myGen = state.gen;
    const stale = () => state.gen !== myGen;
    // Message lines start from whichever icon was actually clicked — the pencil for a write,
    // the eye for a read — rather than a neutral point between them.
    const clientAnimX = type === "write" ? client.writeX : client.readX;

    const key = keySelect.value || KEYS[0];
    // Every write auto-increments that key's own counter (1, 2, 3, …) rather than reusing
    // whatever was last typed — a manual edit to the Value field just rebases where it resumes.
    let value;
    if (type === "write") {
      const manual = Math.max(0, Math.min(999, parseInt(valueInput.value, 10) || 0));
      value = state.writeCounters[key] !== undefined ? state.writeCounters[key] + 1 : (manual || 1);
      state.writeCounters[key] = value;
      valueInput.value = value;
    }
    const opLabel = type === "write" ? `${key}=${value}` : `${key}?`;

    const upNodes = state.nodes.filter((n) => n.up);
    if (upNodes.length === 0) {
      log("fail", `${type.toUpperCase()} (${opLabel}) aborted — no live nodes in the cluster, NACK (UNAVAILABLE)`);
      return;
    }

    const n = state.numNodes;
    const rf = Math.min(state.rf, n);
    const tokenStart = tokenIndexForKey(key, n);
    const replicaIdxs = computeReplicaIdxs(tokenStart, rf, n);
    const replicas = replicaIdxs.map((i) => state.nodes[i]);
    const distinctRacks = new Set(replicas.map((r) => r.rack)).size;
    const req = requiredAcks(state.cl, rf);
    const anyHintFallback = state.cl === "ANY" && type === "write";

    // A smart (token-aware) driver knows which nodes hold the key and routes straight to one of
    // them as coordinator, skipping the extra proxy hop. A non-token-aware driver instead goes
    // through whatever node it's connected to, which is deliberately forced to a non-replica
    // here so every replica hop is a real network round trip.
    let coordinatorPool = upNodes;
    let forcedReplica = false;
    let forcedNonReplica = false;
    if (state.smartDrivers) {
      const replicaUp = upNodes.filter((nd) => replicaIdxs.includes(nd.idx));
      if (replicaUp.length > 0) { coordinatorPool = replicaUp; forcedReplica = true; }
    } else {
      const nonReplicaUp = upNodes.filter((nd) => !replicaIdxs.includes(nd.idx));
      if (nonReplicaUp.length > 0) { coordinatorPool = nonReplicaUp; forcedNonReplica = true; }
    }
    const coordinator = coordinatorPool[Math.floor(Math.random() * coordinatorPool.length)];

    highlightCoordinatorAndReplicas(coordinator, replicaIdxs);

    // What the coordinator's failure detector already believes, before sending a single message
    const plan = replicas.map((r) => {
      const isSelf = r.idx === coordinator.idx;
      return { replica: r, isSelf, reachable: isSelf || r.up };
    });
    const knownReachable = plan.filter((p) => p.reachable).length;
    const readNote = type === "read" ? " [full read + digest reads]" : "";
    const coordNote = state.smartDrivers
      ? (forcedReplica ? " [smart driver routed directly to a replica]" : " [no live replica available, coordinator is a non-replica]")
      : (forcedNonReplica ? " [non-token-aware: coordinator forced ≠ replica]" : " [no non-replica node available, coordinator is a replica]");

    log("info", `${client.id} → ${coordinator.id}: ${type.toUpperCase()} (${opLabel}) coordinator, natural replicas [${replicas.map((r) => r.id).join(", ")}] spanning ${distinctRacks}/${state.numRacks} zones/racks @ CL=${state.cl} needs ${req}/${rf}${readNote}${coordNote}`);

    await animatePacket(clientAnimX, client.animY, coordinator.x, coordinator.y, { duration: 260 * SLOWDOWN, fail: false, label: opLabel, type, insetStart: 0 });
    if (stale()) return;

    if (knownReachable < req && !anyHintFallback) {
      log("fail", `${coordinator.id}: UNAVAILABLE — only ${knownReachable}/${rf} replicas reachable, need ${req}. Rejected before contacting replicas (fail-fast).`);
      log("fail", `${coordinator.id} → ${client.id}: NACK (${key})`);
      await animatePacket(coordinator.x, coordinator.y, clientAnimX, client.animY, { duration: 220 * SLOWDOWN, fail: true, label: `NACK ${key}`, type, insetEnd: 0 });
      clearHighlight();
      return;
    }

    // Which contacted replica serves the full read: the coordinator's own local copy if it's a
    // natural replica, otherwise the first remote *reachable* replica contacted — everyone else
    // only needs to return a lightweight digest to confirm agreement. A known-down replica is
    // never actually contacted, so it's excluded here too — otherwise it could claim the "data"
    // slot and leave every replica that's really contacted downgraded to a "digest".
    let dataSent = plan.some((p) => p.isSelf);
    const contacted = plan.map((p) => {
      let label = null;
      if (type === "read" && !p.isSelf && p.reachable) { label = dataSent ? "digest" : "data"; dataSent = true; }
      return { ...p, label };
    });

    const capturedValues = {}; // replica idx -> value seen at the moment it applied/answered (reads only)

    // Fan out in parallel — but only to replicas the coordinator already believes are live.
    const settleTasks = contacted.map((p) => (async () => {
      if (p.isSelf) {
        if (type === "write") { p.replica.data[key] = value; renderNodeKv(p.replica); }
        else capturedValues[p.replica.idx] = p.replica.data[key];
        return { ...p, ok: true };
      }
      if (!p.reachable) {
        // Known down already — don't send a request that has no chance of an answer.
        log("warn", `${coordinator.id}: skipping ${p.replica.id} — already known down, not contacted`);
        return { ...p, ok: false };
      }
      const outLabel = type === "write" ? `${key}=${value}` : `${key}?`;
      const outDur = randomLatency(coordinator, p.replica);
      await animatePacket(coordinator.x, coordinator.y, p.replica.x, p.replica.y, { duration: outDur, fail: false, label: outLabel, type });
      if (stale()) return { ...p, ok: false };
      if (type === "write") { p.replica.data[key] = value; renderNodeKv(p.replica); }
      else capturedValues[p.replica.idx] = p.replica.data[key];
      const backLabel = type === "write" ? `${key} ✓` : `${key}=${fmtVal(p.replica.data[key])}`;
      const backDur = randomLatency(coordinator, p.replica) * 0.7;
      await animatePacket(p.replica.x, p.replica.y, coordinator.x, coordinator.y, { duration: backDur, fail: false, label: backLabel, type });
      return { ...p, ok: true };
    })());

    // Race to quorum: resolve as soon as `req` acks land — a real coordinator does not wait
    // for the slower or unreachable replicas once CL is satisfied.
    let ackCount = 0, decided = false, decidedEarly = false, decide;
    const decision = new Promise((resolve) => { decide = resolve; });
    settleTasks.forEach((p) => p.then((r) => {
      if (r.ok) {
        ackCount++;
        if (!decided && ackCount >= req) { decided = true; decidedEarly = true; decide(ackCount); }
      }
    }));
    Promise.all(settleTasks).then(() => { if (!decided) { decided = true; decide(ackCount); } });

    const acksAtDecision = await decision;
    if (stale()) return;
    const hinted = anyHintFallback && acksAtDecision === 0;
    const success = anyHintFallback ? true : acksAtDecision >= req;

    const primary = plan.find((p) => p.isSelf) || contacted.find((p) => p.label === "data");
    const primaryValue = primary ? capturedValues[primary.replica.idx] : undefined;
    const readValue = primaryValue !== undefined ? primaryValue : Object.values(capturedValues)[0];

    const replyLabel = !success ? `NACK ${key}` : type === "write" ? `ACK ${key}=${value}` : `ACK ${key}=${fmtVal(readValue)}`;
    await animatePacket(coordinator.x, coordinator.y, clientAnimX, client.animY, { duration: 260 * SLOWDOWN, fail: !success, label: replyLabel, type, insetEnd: 0 });
    if (stale()) return;

    if (hinted) {
      log("warn", `${coordinator.id} → ${client.id}: ACK (${key}=${value}, hinted handoff — 0/${rf} replicas ack'd, hint stored at coordinator)`);
    } else if (success) {
      const earlyNote = decidedEarly ? " — coordinator replied without waiting for the remaining replicas" : "";
      const valueNote = type === "write" ? `${key}=${value}` : `${key}=${fmtVal(readValue)}`;
      log("success", `${coordinator.id} → ${client.id}: ACK (${valueNote}) — CL=${state.cl} met at ${acksAtDecision}/${rf} acks, needed ${req}${earlyNote}`);
    } else {
      log("fail", `${coordinator.id} → ${client.id}: NACK (${key}) — only ${acksAtDecision}/${rf} replicas ack'd within the timeout, needed ${req}`);
    }

    Promise.all(settleTasks).then(() => setTimeout(clearHighlight, 150));
  }

  // ---------- fault injection ----------
  // Clicking a rack toggles every node in it together — the scenario rack-aware placement is
  // meant to survive, since a key's replicas are spread across racks rather than clustered in
  // one. Mirrors the per-node click toggle: any node up -> take the whole rack down; otherwise
  // bring it back.
  function toggleRack(rackIdx) {
    const members = state.nodes.filter((n) => n.rack === rackIdx);
    const anyUp = members.some((n) => n.up);
    members.forEach((n) => (n.up = !anyUp));
    log(anyUp ? "warn" : "info", anyUp
      ? `Zone/Rack ${rackIdx} DOWN — nodes [${members.map((n) => n.id).join(", ")}] failed together (simulated zone/rack outage)`
      : `Zone/Rack ${rackIdx} revived — nodes [${members.map((n) => n.id).join(", ")}] back UP`);
    renderNodes();
  }

  // ---------- wiring ----------
  // Recompute the derived total node count whenever zones or nodes-per-zone change, and clamp
  // RF (which can't exceed the node count) to match.
  function applyNodeCount() {
    state.numNodes = state.numRacks * state.nodesPerRack;
    const maxRf = Math.min(5, state.numNodes);
    rfRange.max = maxRf;
    if (state.rf > maxRf) { state.rf = maxRf; rfRange.value = maxRf; rfVal.textContent = maxRf; }
    refreshClOptions();
    layout();
  }

  racksRange.addEventListener("input", () => {
    state.numRacks = Number(racksRange.value);
    racksVal.textContent = state.numRacks;
    applyNodeCount();
  });

  nodesRange.addEventListener("input", () => {
    state.nodesPerRack = Number(nodesRange.value);
    nodesVal.textContent = state.nodesPerRack;
    applyNodeCount();
  });

  rfRange.addEventListener("input", () => {
    state.rf = Number(rfRange.value);
    rfVal.textContent = state.rf;
    refreshClOptions();
  });

  clSelect.addEventListener("change", () => {
    state.cl = clSelect.value;
  });

  keySelect.addEventListener("change", () => {
    const nextVal = (state.writeCounters[keySelect.value] || 0) + 1;
    valueInput.value = nextVal;
  });

  clientsRange.addEventListener("input", () => {
    state.numClients = Number(clientsRange.value);
    clientsVal.textContent = state.numClients;
    layout();
  });

  smartDriversToggle.addEventListener("change", () => {
    state.smartDrivers = smartDriversToggle.checked;
  });

  btnClearLog.addEventListener("click", () => (logBody.innerHTML = ""));

  // ---------- guided tour ----------
  // A minimal WalkMe-style spotlight tour: a full-page overlay, a highlighted cutout around the
  // current target (CSS box-shadow trick — no SVG mask needed), and a tooltip card with
  // Back/Next/Skip. Targets are re-queried live on each step rather than cached, since layout()
  // tears down and rebuilds the SVG on every control change.
  const TOUR_SEEN_KEY = "scylladb-ha-tour-seen";
  const tourSteps = [
    {
      target: () => document.querySelector('#clientsLayer button[title^="Send write"]'),
      title: "Send a write",
      body: "Each client can act on its own. Click the pencil to write the next value for the selected key from that client.",
      placement: "right",
    },
    {
      target: () => document.querySelector('#clientsLayer button[title^="Send read"]'),
      title: "Send a read",
      body: "Click the eye to read the current value of the selected key from that client.",
      placement: "right",
    },
    {
      target: () => document.querySelector('#nodesLayer .node-slot'),
      title: "Nodes",
      body: "Click any node to take it down or bring it back up, and watch how RF and CL decide whether requests still succeed.",
      placement: "bottom",
    },
    {
      target: () => document.querySelector('#rackBoxesLayer .rack-box'),
      title: "Zones/Racks",
      body: "Click a zone/rack's border to kill or revive every node in it together — a whole-zone/rack outage, not just one node.",
      placement: "bottom",
    },
  ];
  let tourIndex = 0;
  let tourEls = null;

  function tourPosition() {
    if (!tourEls) return;
    const target = tourSteps[tourIndex].target();
    if (!target) { tourEnd(); return; }
    const r = target.getBoundingClientRect();
    const pad = 6;
    tourEls.highlight.style.left = (r.left - pad) + "px";
    tourEls.highlight.style.top = (r.top - pad) + "px";
    tourEls.highlight.style.width = (r.width + pad * 2) + "px";
    tourEls.highlight.style.height = (r.height + pad * 2) + "px";
    tourEls.highlight.style.borderRadius = (r.width + pad * 2 <= (r.height + pad * 2) * 1.4) ? "999px" : "10px";

    const tw = tourEls.tooltip.offsetWidth, th = tourEls.tooltip.offsetHeight;
    const gap = 14;
    const placement = tourSteps[tourIndex].placement;
    let left, top;
    if (placement === "right") { left = r.right + gap; top = r.top + r.height / 2 - th / 2; }
    else { left = r.left + r.width / 2 - tw / 2; top = r.bottom + gap; }
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - th - 8));
    tourEls.tooltip.style.left = left + "px";
    tourEls.tooltip.style.top = top + "px";
  }

  function tourRender() {
    const step = tourSteps[tourIndex];
    const last = tourIndex === tourSteps.length - 1;
    tourEls.tooltip.innerHTML = `
      <div class="tour-step">Step ${tourIndex + 1} of ${tourSteps.length}</div>
      <h3 class="tour-title">${step.title}</h3>
      <p class="tour-body">${step.body}</p>
      <div class="tour-actions">
        <button type="button" class="btn btn--xs tour-skip">Skip</button>
        <div class="tour-actions-right">
          ${tourIndex > 0 ? '<button type="button" class="btn btn--xs tour-back">Back</button>' : ""}
          <button type="button" class="btn btn--xs btn--primary tour-next">${last ? "Done" : "Next"}</button>
        </div>
      </div>
    `;
    tourEls.tooltip.querySelector(".tour-skip").addEventListener("click", tourEnd);
    const backBtn = tourEls.tooltip.querySelector(".tour-back");
    if (backBtn) backBtn.addEventListener("click", () => { tourIndex--; tourShow(); });
    tourEls.tooltip.querySelector(".tour-next").addEventListener("click", () => {
      if (last) tourEnd();
      else { tourIndex++; tourShow(); }
    });
  }

  function tourShow() {
    const target = tourSteps[tourIndex].target();
    if (!target) { tourEnd(); return; }
    target.scrollIntoView({ block: "center", behavior: "auto" });
    tourRender();
    // Called synchronously, not via requestAnimationFrame: reading tooltip.offsetWidth inside
    // tourPosition() already forces the layout it needs, and rAF has no guaranteed timing here
    // (e.g. right after a scrollIntoView, before the browser has settled on a final scroll position).
    tourPosition();
  }

  function tourStart() {
    if (tourEls) return;
    tourIndex = 0;
    const overlay = document.createElement("div");
    overlay.className = "tour-overlay";
    const highlight = document.createElement("div");
    highlight.className = "tour-highlight";
    const tooltip = document.createElement("div");
    tooltip.className = "tour-tooltip";
    document.body.append(overlay, highlight, tooltip);
    tourEls = { overlay, highlight, tooltip };
    window.addEventListener("resize", tourPosition);
    window.addEventListener("scroll", tourPosition, true);
    tourShow();
  }

  function tourEnd() {
    if (!tourEls) return;
    tourEls.overlay.remove();
    tourEls.highlight.remove();
    tourEls.tooltip.remove();
    tourEls = null;
    window.removeEventListener("resize", tourPosition);
    window.removeEventListener("scroll", tourPosition, true);
    localStorage.setItem(TOUR_SEEN_KEY, "1");
  }

  btnShowTour.addEventListener("click", tourStart);

  // ---------- init ----------
  KEYS.forEach((k) => {
    const el = document.createElement("option");
    el.value = k; el.textContent = k;
    keySelect.appendChild(el);
  });
  refreshClOptions();
  layout();
  log("info", "Simulator ready. Send a request or kill a zone/rack to see how RF/CL determine availability.");
  if (!localStorage.getItem(TOUR_SEEN_KEY)) {
    setTimeout(tourStart, 500);
  }
})();
</script>
</body>
</html>
